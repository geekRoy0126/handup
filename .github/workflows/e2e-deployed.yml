# Runs the Playwright @smoke tests against each Vercel deployment: the preview of every PR and production on main.
# Vercel reports deployments to GitHub, which fires `deployment_status`.
# If Vercel Deployment Protection is on, add repo secret VERCEL_AUTOMATION_BYPASS_SECRET (docs/setup-deploy.md).
name: E2E on deployment

on:
  deployment_status:

permissions:
  contents: read

jobs:
  e2e-deployed:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop --grep @smoke
