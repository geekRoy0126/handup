# Security scanning on every PR, on main, and weekly: npm audit, gitleaks, Semgrep, and (once public) CodeQL
# and dependency review.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (high and above)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm audit --audit-level=high --omit=dev

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: SAST (Semgrep)
    # Runs on private repos too (no GitHub Advanced Security needed), so PRs get static analysis while
    # CodeQL is skipped (#46). Rules: TypeScript, React, Node.js (njsscan) and secrets. Fails on any finding.
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.184.0
    steps:
      - uses: actions/checkout@v7
      - run: >-
          semgrep scan --error --metrics=off
          --config p/typescript --config p/react --config p/nodejsscan --config p/secrets

  dependency-review:
    name: Dependency review
    # Needs GitHub Advanced Security on private repos; runs once the repo is public.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  codeql:
    name: CodeQL
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
